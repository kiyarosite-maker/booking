<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Maa Vaishno Express</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Top Luxury Header -->
  <header class="bg-gradient-to-r from-red-900 via-red-700 to-amber-700 shadow-2xl border-b border-amber-500/30">
      <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
          <div class="flex items-center gap-3">
              <div class="bg-amber-400 text-red-950 p-3 rounded-2xl shadow-lg">
                  <i class="fa-solid fa-user-tie text-2xl"></i>
              </div>
              <div>
                  <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide text-white drop-shadow-md">
                      MAA VAISHNO EXPRESS
                  </h1>
                  <p class="text-xs text-amber-200 font-medium">Admin Control Panel</p>
              </div>
          </div>
          
          <div class="flex items-center gap-3 bg-black/40 px-5 py-2.5 rounded-full border border-amber-400/30">
              <span class="text-amber-300 font-semibold text-sm"><i class="fa-solid fa-shield-halved text-green-400 mr-1"></i> Dashboard Secure</span>
          </div>
      </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
    
    <!-- Price Management Section -->
    <div class="bg-slate-800/90 rounded-2xl p-6 border border-slate-700/80 shadow-2xl mb-8">
      <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-amber-400 border-b border-slate-700 pb-3">
        <i class="fa-solid fa-tags"></i> Dynamic Ticket Price Settings
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-end">
        <div>
          <label class="block text-xs text-slate-300 mb-1 font-semibold">One Way Price (₹)</label>
          <input type="number" id="oneWayPriceInput" min="0" placeholder="e.g. 1299" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-amber-500 outline-none transition-all">
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1 font-semibold">Return Only Price (₹)</label>
          <input type="number" id="returnWayPriceInput" min="0" placeholder="e.g. 1299" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-amber-500 outline-none transition-all">
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1 font-semibold">Two Way / Round Trip Price (₹)</label>
          <input type="number" id="twoWayPriceInput" min="0" placeholder="e.g. 2500" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-amber-500 outline-none transition-all">
        </div>
        <div>
          <button id="savePricesBtn" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-xl transition-all flex justify-center items-center gap-2">
            <i class="fa-solid fa-floppy-disk"></i> Update Price
          </button>
        </div>
      </div>
    </div>

    <!-- Booked Seats & Payment Management -->
    <div class="bg-slate-800/90 rounded-2xl p-6 border border-slate-700/80 shadow-2xl">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b border-slate-700 pb-4">
        <div>
          <h2 class="text-xl font-bold flex items-center gap-2 text-amber-400">
            <i class="fa-solid fa-address-book"></i> Booked Tickets List
          </h2>
          <span id="totalSeatsBadge" class="mt-2 inline-block bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full text-xs font-bold tracking-wide">
            Total Seats Booked: 0
          </span>
        </div>
        <div class="w-full md:w-1/3 relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
          <input type="text" id="searchInput" placeholder="Search by phone number..." class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 pl-9 pr-4 text-sm text-white focus:border-amber-500 outline-none transition-all">
        </div>
      </div>

      <div class="overflow-x-auto rounded-lg border border-slate-700/50">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="text-xs uppercase bg-slate-900/80 text-slate-400 border-b border-slate-700">
            <tr>
              <th class="px-4 py-4 font-semibold">Customer Name</th>
              <th class="px-4 py-4 font-semibold">Phone Number</th>
              <th class="px-4 py-4 font-semibold">Trip Type</th>
              <th class="px-4 py-4 font-semibold">Seats</th>
              <th class="px-4 py-4 font-semibold">Total Price</th>
              <th class="px-4 py-4 font-semibold">Status</th>
              <th class="px-4 py-4 font-semibold text-center">Action</th>
            </tr>
          </thead>
          <tbody id="bookingsTableBody" class="divide-y divide-slate-700/50">
            <!-- Dynamic rows loaded from Firebase -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AlzaSyAABvh6xwaH4J3RJLOCg_IFggfBLZDgICE",
      authDomain: "buss-c821b.firebaseapp.com",
      databaseURL: "https://buss-c821b-default-rtdb.firebaseio.com",
      projectId: "buss-c821b",
      storageBucket: "buss-c821b.firebasestorage.app",
      messagingSenderId: "420408813048",
      appId: "1:420408813048:web:d64ce1241ab24608dde20d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let allBookings = [];

    // --- Price Management Logic ---
    function loadPricesFromFirebase() {
      const pricesRef = ref(db, 'ticketPrices');
      onValue(pricesRef, (snapshot) => {
        const prices = snapshot.val() || { oneWay: 1299, returnWay: 1299, twoWay: 2500 };
        document.getElementById('oneWayPriceInput').value = prices.oneWay || 1299;
        document.getElementById('returnWayPriceInput').value = prices.returnWay || 1299;
        document.getElementById('twoWayPriceInput').value = prices.twoWay || 2500;
      });
    }

    document.getElementById('savePricesBtn').addEventListener('click', async () => {
      const prices = {
        oneWay: parseFloat(document.getElementById('oneWayPriceInput').value) || 0,
        returnWay: parseFloat(document.getElementById('returnWayPriceInput').value) || 0,
        twoWay: parseFloat(document.getElementById('twoWayPriceInput').value) || 0
      };

      try {
        await set(ref(db, 'ticketPrices'), prices);
        alert('Ticket prices updated live! They will apply immediately on the booking page.');
      } catch (err) {
        alert('Error updating prices: ' + err.message);
      }
    });

    // --- Bookings Management Logic ---
    function listenToBookings() {
      const bookingsRef = ref(db, 'bookings');
      onValue(bookingsRef, (snapshot) => {
        const data = snapshot.val();
        allBookings = [];
        
        if (data) {
          Object.keys(data).forEach(key => {
            allBookings.push({ ...data[key], firebaseKey: key });
          });
        }
        
        renderBookings();
      });
    }

    window.markAsPaid = async function(bookingId) {
      try {
        await update(ref(db, `bookings/${bookingId}`), { status: 'Paid' });
      } catch (err) {
        alert('Could not update status: ' + err.message);
      }
    };

    function renderBookings() {
      const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      const tbody = document.getElementById('bookingsTableBody');
      tbody.innerHTML = '';

      let totalSeats = 0;

      const filtered = allBookings.filter(b => {
        const phone = b.phone ? String(b.phone) : '';
        return phone.includes(searchQuery);
      });

      filtered.forEach(booking => {
        const seatsCount = booking.seatsCount || (booking.seats ? booking.seats.split(',').length : 0);
        totalSeats += parseInt(seatsCount) || 0;

        const isPaid = booking.status === 'Paid';

        const statusBadge = isPaid 
          ? '<span class="bg-green-500/20 text-green-400 border border-green-500/30 px-2.5 py-1 rounded-md text-xs font-bold">Paid</span>'
          : '<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-md text-xs font-bold">Pending</span>';

        const actionBtn = !isPaid 
          ? `<button class="bg-green-600 hover:bg-green-500 text-white font-bold py-1.5 px-3 rounded-lg text-xs transition-colors shadow-lg flex items-center justify-center gap-1 mx-auto" onclick="markAsPaid('${booking.id || booking.firebaseKey}')"><i class="fa-solid fa-check"></i> Payment Done</button>`
          : `<span class="text-green-400 font-bold flex items-center justify-center gap-1 text-xs"><i class="fa-solid fa-check-double"></i> Verified</span>`;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-800/50 transition-colors";
        tr.innerHTML = `
          <td class="px-4 py-3 font-medium text-white">${booking.name || booking.custName || 'N/A'}</td>
          <td class="px-4 py-3"><a href="tel:${booking.phone}" class="text-amber-400 hover:underline"><i class="fa-solid fa-phone text-xs mr-1"></i>${booking.phone || 'N/A'}</a></td>
          <td class="px-4 py-3">${booking.tripType || booking.type || 'One Way'}</td>
          <td class="px-4 py-3 font-bold text-white">${booking.seats || 'N/A'}</td>
          <td class="px-4 py-3 font-medium text-amber-400">₹ ${(booking.totalAmount || booking.totalPrice || 0).toLocaleString('en-IN')}</td>
          <td class="px-4 py-3">${statusBadge}</td>
          <td class="px-4 py-3 text-center">${actionBtn}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('totalSeatsBadge').innerText = `Total Seats Booked: ${totalSeats}`;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-slate-500"><i class="fa-solid fa-inbox text-3xl mb-2 block"></i> No bookings found.</td></tr>`;
      }
    }

    document.getElementById('searchInput').addEventListener('input', renderBookings);

    // Initial load
    loadPricesFromFirebase();
    listenToBookings();
  </script>
</body>
</html>
